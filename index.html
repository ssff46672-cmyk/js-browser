<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Browser - Code Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">JS <span>Browser</span></div>
        <div class="top-actions">
            <button id="runBtn" class="run-btn">▶ Run</button>
            <button id="saveBtn">Save</button>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar">
            <h3>EXPLORER</h3>
            <p class="folder">📁 MY PROJECT</p>

            <button class="file active" data-file="html">🌐 index.html</button>
            <button class="file" data-file="css">🎨 style.css</button>
            <button class="file" data-file="js">🟨 script.js</button>

            <div class="sidebar-info">
                <p>JS Browser Editor</p>
                <small>Write code. Run. Learn.</small>
            </div>
        </aside>

        <main class="main-area">
            <div class="tab-bar">
                <div id="currentTab">🌐 index.html</div>
                <span id="saveStatus">Ready</span>
            </div>

            <div class="editor-container">
                <div id="lineNumbers">1</div>
                <textarea
                    id="editor"
                    spellcheck="false"
                    aria-label="Code editor"
                    autocomplete="off"
                    autocapitalize="off"
                ></textarea>
            </div>

            <section class="preview-section">
                <div class="preview-header">
                    <span>LIVE PREVIEW</span>
                    <button id="refreshBtn">↻ Refresh</button>
                </div>
                <iframe
                    id="preview"
                    title="Live preview"
                    sandbox="allow-scripts"
                ></iframe>
            </section>

            <footer class="statusbar">
                <span id="languageLabel">HTML</span>
                <span>JS Browser</span>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
