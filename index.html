<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Browser - Online Code Editor</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/theme/dracula.min.css">

    <link rel="stylesheet" href="./style.Css">
</head>
<body>
    <header class="topbar">
        <div class="brand">JS <span>Browser</span></div>

        <div class="top-actions">
            <button id="newFileBtn">＋ New File</button>
            <button id="deleteFileBtn">Delete</button>
            <button id="saveBtn">Save</button>
            <button id="exportBtn">Export ZIP</button>
            <button id="runBtn" class="run-btn">▶ Run</button>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar">
            <div class="sidebar-heading">
                <h3>EXPLORER</h3>
                <button id="sidebarNewBtn" title="New file">＋</button>
            </div>

            <p class="folder">📁 MY PROJECT</p>
            <div id="fileList"></div>

            <div class="sidebar-info">
                <p>JS Browser Editor</p>
                <small>Write code. Run. Learn.</small>
            </div>
        </aside>

        <main class="main-area">
            <div class="tab-bar">
                <div id="currentTab">index.html</div>
                <span id="saveStatus">Ready</span>
            </div>

            <div class="editor-container">
                <textarea id="editor" spellcheck="false"></textarea>
            </div>

            <section class="bottom-panel">
                <div class="panel-tabs">
                    <button class="panel-tab active" data-panel="preview">
                        Preview
                    </button>
                    <button class="panel-tab" data-panel="console">
                        Console
                    </button>
                    <button id="refreshBtn">↻ Refresh</button>
                    <button id="clearConsoleBtn">Clear Console</button>
                </div>

                <div id="previewPanel" class="panel-content">
                    <iframe
                        id="preview"
                        title="Website preview"
                        sandbox="allow-scripts">
                    </iframe>
                </div>

                <div id="consolePanel" class="panel-content hidden">
                    <div id="consoleOutput">
                        <p class="console-hint">
                            JavaScript messages and errors appear here.
                        </p>
                    </div>
                </div>
            </section>

            <footer class="statusbar">
                <span id="languageLabel">HTML</span>
                <span>JS Browser</span>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
